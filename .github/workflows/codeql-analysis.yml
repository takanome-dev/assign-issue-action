name: 'CodeQL'

on:
  pull_request:
    branches: [main, beta, edge]

jobs:
  analyze:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript']
        node-version: [20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19

      - name: Install dependencies
        run: bun install

      - name: Build files
        run: bun run tsdown

      - name: Setup CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Perform Analysis
        uses: github/codeql-action/analyze@v4
